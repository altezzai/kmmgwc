{% extends "admin_header.html" %} {% block content %} {% load static %}

<body class="edit-body">
    <div class="edit-formcon">
        <h2>Create Event</h2>

        {% if errors %}
        <div style="color: red">
            {% for field, error_list in errors.items %}
            <p>{{ field }}: {{ error_list.0 }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Title:</label>
            <input
                class="inp"
                type="text"
                name="title"
                value="{{ data.title }}"
                required
            />

            <label>Time:</label>
            <input
                class="inp"
                type="time"
                name="time"
                value="{{ data.time }}"
                required
            />

            <label>Date:</label>
            <input
                class="inp"
                type="date"
                name="date"
                value="{{ data.date }}"
                required
            />

            <label>Description:</label>
            <textarea class="inp tarea" name="description" rows="4" required>
{{ data.description }}</textarea
            >

            <label>Venue:</label>
            <input
                class="inp"
                type="text"
                name="venue"
                value="{{ data.venue }}"
                required
            />

            <label>URL:</label>
            <input class="inp" type="url" name="url" value="{{ data.url }}" />

            <button type="submit" class="btn">Create</button>
        </form>

        <a href="{% url 'event_list' %}" class="btn-edit btn">Back to List</a>
    </div>
</body>

{% endblock %}
