{% extends "admin_header.html" %}
{% block content %}
    {% load static %}
    <body class="edit-body">
        <div class="edit-formcon">
            <h1>Create Department</h1>
            {% if errors %}
                <div style="color: red">
                    {% for field, error_list in errors.items %}<p>{{ field }}: {{ error_list.0 }}</p>{% endfor %}
                </div>
            {% endif %}
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <label>Name:</label>
                <input class="inp" type="text" name="name" value="{{ data.name }}" required />
                <label>Description:</label>
                <textarea class="inp tarea" name="description" required>
{{ data.description }}</textarea>
                <label>Photo:</label>
                <input type="file" name="photos" accept="image/*" />
                <button type="submit">Create</button>
            </form>
            <a href="{% url 'department_list' %}" class="btn-edit btn">Back to List</a>
        </div>
    </body>
{% endblock %}
