{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>admin page</title>
        <link rel="stylesheet" href="{% static 'styles.css' %}" />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
              rel="stylesheet" />
        <link rel="stylesheet" href="{% static 'mobile.css' %}" />
        <link rel="stylesheet" href="{% static 'admin.css' %}" />
        <script src="{% static 'script.js' %}" defer></script>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body class="admin-body">
        <div class="navcon">
            <navbar class="flex n">
            <img src="{% static 'assets/logo.png' %}" class="logo" alt="" />
            <img src="{% static 'assets/bm.svg' %}"
                 alt=""
                 class="bm"
                 id="admin-burger-btn" />

            <div class="l">
                <div class="close" id="admin-close-btn">
                    <img src="{% static 'assets/close.svg' %}" alt="" />
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'department_list' %}" class="nav">Departments</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'activity_list' %}" class="nav">Activity</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'employee_list' %}" class="nav">Faculty</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'event_list' %}" class="nav">Events</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'list_notifications' %}" class="nav">Notifications</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'news_list' %}" class="nav">News</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'feedback_list' %}" class="nav">Feedback</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'list_exams' %}" class="nav">Exam</a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'nss_photo_list' %}" class="nav">NSS</a>
                    </div>
                </div>
                <!-- <div class="group flex">
            <div class="flex">
              <a href="{% url 'academic_calendar_list' %}" class="nav">
                <div>Academic Calendar</div>
              </a>
            </div>
          </div> -->
                <!-- <div class="group flex">
            <div class="flex dropdown">
              <a href="{% url 'iqac_member_list' %}" class="nav">IQAC Member</a>
            </div>
          </div> -->
                <div class="group flex">
                    <div class="flex" id="iqac-toggle-btn">
                        <div class="nav">IQAC</div>
                    </div>
                    <div class="dropdown" id="iqacDropdown">
                        <a href="{% url 'iqac_member_list' %}" class="option">
                            <div>IQAC Members</div>
                        </a>
                        <a href="{% url 'iqac_minutes_list' %}" class="option">
                            <div>IQAC Minutes</div>
                        </a>
                        <a href="{% url 'statement_compliance_list' %}" class="option">
                            <div>Statement Compliance</div>
                        </a>
                        <a href="{% url 'best_practice_list' %}" class="option">
                            <div>Best Practice</div>
                        </a>
                        <a href="{% url 'academic_calendar_list' %}" class="option">
                            <div>Academic Calendar</div>
                        </a>
                        <a href="{% url 'student_satisfaction_list' %}" class="option">
                            <div>Student Satisfaction</div>
                        </a>
                        <a href="{% url 'aishe_list' %}" class="option">
                            <div>AISHE</div>
                        </a>
                        <a href="{% url 'aqar_list' %}" class="option">
                            <div>AQAR</div>
                        </a>
                        <a href="{% url 'aqar_report_list' %}" class="option">
                            <div>AQAR Report</div>
                        </a>
                    </div>
                </div>
                <div class="group flex">
                    <div class="flex">
                        <a href="{% url 'logout' %}" class="nav">Logout</a>
                    </div>
                </div>
                <script nonce="{{ request.csp_nonce }}">
                document.addEventListener('DOMContentLoaded', function () {
                    var burgerBtn = document.getElementById('admin-burger-btn');
                    if (burgerBtn) burgerBtn.addEventListener('click', opennav);

                    var closeBtn = document.getElementById('admin-close-btn');
                    if (closeBtn) closeBtn.addEventListener('click', closenav);

                    var iqacToggleBtn = document.getElementById('iqac-toggle-btn');
                    var iqacDropdown = document.getElementById('iqacDropdown');
                    if (iqacToggleBtn && iqacDropdown) {
                        iqacToggleBtn.addEventListener('click', function() {
                            if (typeof togglelist === 'function') {
                                togglelist(iqacDropdown, 'drop1');
                            }
                        });
                    }

                    // Global confirm listener for CSP compliance
                    document.body.addEventListener('click', function (e) {
                        const target = e.target.closest('.confirm-delete');
                        if (target) {
                            const message = target.getAttribute('data-confirm') || 'Are you sure you want to delete this item?';
                            if (!confirm(message)) {
                                e.preventDefault();
                            }
                        }
                    });
                });
                </script>

            </div>
            </navbar>

        </div>
        {% block content %}{% endblock %}
    </body>
</html>
