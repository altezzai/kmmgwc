{% extends "admin_header.html" %} {% block content %} {% load static %}

<body class="edit-body">
    <div class="edit-formcon">
        <h2>Create AQAR Report</h2>

        {% if errors %}
        <div style="color: red">
            {% for field, error_list in errors.items %}
            <p>{{ field }}: {{ error_list.0 }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form id="aqarReportForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label for="name">Name:</label>
            <input
                class="inp"
                type="text"
                id="name"
                name="name"
                value="{{ data.name }}"
                required
            />

            <label for="pdf">Upload PDF:</label>
            <input
                class="inp"
                type="file"
                id="pdf"
                name="pdf"
                accept="application/pdf"
                required
            />

            <button type="submit">Create</button>
        </form>

        <a href="{% url 'aqar_report_list' %}" class="btn-edit btn"
            >Back to List</a
        >
    </div>
</body>

{% endblock %}
