{% extends "admin_header.html" %}
{% block content %}
    {% load static %}
    <body class="edit-body">
        <div class="edit-formcon">
            <h2>Create Exam</h2>
            {% if errors %}
                <div style="color: red">
                    {% for field, error_list in errors.items %}<p>{{ field }}: {{ error_list.0 }}</p>{% endfor %}
                </div>
            {% endif %}
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <label class="radio-label">Category:</label>
                <div class="inp rboutcon">
                    <div class="rbcon">
                        <input
                            class="rb"
                            type="radio"
                            name="category"
                            value="ug"
                            {%
                            if
                            data.category=""
                            ="ug"
                            or
                            not
                            data.category
                            %}checked{%
                            endif
                            %}
                            />
                            <label>Undergraduate</label>
                        </div>
                        <div class="rbcon">
                            <input
                                class="rb"
                                type="radio"
                                name="category"
                                value="pg"
                                {%
                                if
                                data.category=""
                                ="pg"
                                %}checked{%
                                endif
                                %}
                                />
                                <label>Postgraduate</label>
                            </div>
                            <div class="rbcon">
                                <input
                                    class="rb"
                                    type="radio"
                                    name="category"
                                    value="both"
                                    {%
                                    if
                                    data.category=""
                                    ="both"
                                    %}checked{%
                                    endif
                                    %}
                                    />
                                    <label>Both</label>
                                </div>
                            </div>
                            <label>Title:</label>
                            <input class="inp"
                                   type="text"
                                   name="title"
                                   value="{{ data.title }}"
                                   required />
                            <label>Description:</label>
                            <textarea class="inp tarea" name="description" rows="4" required>
{{ data.description }}</textarea>
                            <label class="file-label">File:</label>
                            <input class="inp" type="file" name="file" />
                            <button type="submit" class="btn">Create</button>
                        </form>
                        <a href="{% url 'list_exams' %}" class="btn-edit btn">Back to List</a>
                    </div>
                </body>
            {% endblock %}
