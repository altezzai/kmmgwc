{% extends "admin_header.html" %} {% block content %} {% load static %}

<body class="edit-body">
    <div class="edit-formcon">
        <h2>Event Edit</h2>

        {% if errors %}
        <div class="error-msg">
            {% for field, error_list in errors.items %}
            <p>{{ field }}: {{ error_list.0 }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Title:</label>
            <input
                class="inp"
                type="text"
                name="title"
                value="{{ event.title }}"
                required
            />

            <label for="time">Time:</label>
            <input
                class="inp"
                type="time"
                name="time"
                value="{{ event.time|time:'H:i' }}"
                required
            />

            <label for="date">Date:</label>
            <input
                class="inp"
                type="date"
                name="date"
                value="{{ event.date|date:'Y-m-d' }}"
                required
            />

            <label for="description">Description:</label>
            <textarea class="tarea inp" name="description" rows="4" required>
{{ event.description }}</textarea
            >

            <label for="venue">Venue:</label>
            <input
                class="inp"
                type="text"
                name="venue"
                value="{{ event.venue }}"
                required
            />

            <label for="url">URL:</label>
            <input class="inp" type="url" name="url" value="{{ event.url }}" />

            <button type="submit">Update Event</button>
        </form>

        <a href="{% url 'event_list' %}" class="btn-edit btn">Back to List</a>
    </div>
</body>

{% endblock %}
